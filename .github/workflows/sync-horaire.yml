name: Synchroniser horaire UCLouvain

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-horaire
  cancel-in-progress: false

jobs:
  sync-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Télécharger le calendrier privé
        env:
          UCL_CALENDAR_URL: ${{ secrets.UCL_CALENDAR_URL }}
        run: |
          set -euo pipefail
          if [ -z "${UCL_CALENDAR_URL:-}" ]; then
            echo "Le secret UCL_CALENDAR_URL est absent."
            exit 1
          fi
          curl --fail --location --silent --show-error \
            --max-time 60 \
            "$UCL_CALENDAR_URL" \
            --output "$RUNNER_TEMP/ucl-horaire.ics"
          grep -q 'BEGIN:VCALENDAR' "$RUNNER_TEMP/ucl-horaire.ics"
          grep -q 'END:VCALENDAR' "$RUNNER_TEMP/ucl-horaire.ics"

      - name: Préparer Python et parser le calendrier
        run: |
          python -m pip install --disable-pip-version-check icalendar
          python scripts/parse_calendar.py "$RUNNER_TEMP/ucl-horaire.ics" data/cours.json

      - name: Publier les données actualisées
        run: |
          set -euo pipefail
          # Ne plus conserver le flux ICS brut dans le dépôt ; seul le JSON publié reste.
          git rm -f --ignore-unmatch horaire.ics
          git add data/cours.json
          if git diff --cached --quiet; then
            echo "Aucun changement dans le calendrier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mise à jour automatique de l'horaire UCLouvain"
          git push
