<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08090a">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
<title>Agenda d’Abdo</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
  --bg: #08090a; --surface: #0f1011; --raised: #191a1b;
  --text: #f7f8f8; --muted: #8a8f98; --line: rgba(255,255,255,.07);
  --today: rgba(94,106,210,.10); --warn: #e5594d;
  --accent: #5e6ad2; --accent-ui: #7170ff; --accent-hover: #828fff;
  --cours: #5e6ad2; --etude: #3f9e72; --argent: #c4912c; --sport: #d0587a;
  --g-sleep: linear-gradient(90deg, #5e6ad2, #9aa3ff);
  --g-etude: linear-gradient(90deg, #2f9a6b, #6fd6a4);
  --g-sport: linear-gradient(90deg, #d0587a, #ff9aa8);
  --g-argent: linear-gradient(90deg, #c4912c, #f2cd6b);
  --g-xp: linear-gradient(90deg, #5e6ad2, #9aa3ff);
  --shadow: 0 0 0 1px rgba(255,255,255,.02) inset, 0 8px 24px rgba(0,0,0,.4);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; max-width: 1100px; margin-inline: auto; }
button { font-family: inherit; color: inherit; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
h1 { font-size: 22px; margin: 0; }
#sync { font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; white-space: nowrap; }
.card { background: var(--surface); border-radius: 18px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); }

/* XP */
.lvl { font-size: 16px; font-weight: 700; }
.lvl span { font-weight: 400; color: var(--muted); font-size: 13px; }
.tmsg { color: var(--muted); font-size: 12px; margin-top: 6px; }
.reward { width: 100%; margin-top: 10px; padding: 10px 12px; font-size: 14px; border: 1px dashed var(--line); border-radius: 12px; background: transparent; color: var(--text); }

/* Barres */
.pbar { position: relative; height: 16px; background: var(--line); border-radius: 999px; overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; border-radius: 999px; transition: width .8s cubic-bezier(.22, 1, .36, 1); box-shadow: inset 0 -2px 0 rgba(0,0,0,.08), inset 0 2px 0 rgba(255,255,255,.28); }
.g-sleep { background: var(--g-sleep); } .g-etude { background: var(--g-etude); } .g-sport { background: var(--g-sport); } .g-argent { background: var(--g-argent); } .g-xp { background: var(--g-xp); }
.xpcard .pbar { margin-top: 10px; height: 12px; }

/* Semaine */
.weeknav { display: grid; grid-template-columns: 52px 1fr 52px; gap: 10px; align-items: center; margin-bottom: 14px; }
.weeknav button { height: 52px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); font-size: 26px; cursor: pointer; box-shadow: var(--shadow); }
.weeknav button:disabled { opacity: .35; cursor: default; }
.weeknav button:active { transform: scale(.96); }
.weeklabel { text-align: center; }
.weeklabel b { display: block; font-size: 20px; }
.weeklabel span { color: var(--muted); font-size: 13px; }
.weeknav .todaybtn { display: block; margin: 6px auto 0; width: auto; height: auto; padding: 5px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 12px; font-weight: 650; box-shadow: none; cursor: pointer; }
.weeknav .todaybtn[hidden] { display: none; }
.wph { aspect-ratio: 3 / 2; background: linear-gradient(#061d27, #0b3640); display: flex; align-items: center; justify-content: center; color: #5d8a99; font-size: 13px; }
.wcard.future .wt { opacity: .8; }

/* Objectifs */
.obj { margin-bottom: 16px; }
.obj:last-of-type { margin-bottom: 0; }
.objhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 7px; }
.objname { font-weight: 650; font-size: 15px; }
.objval { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.objval b { color: var(--text); }
.edit { border: none; background: transparent; color: var(--muted); font-size: 14px; cursor: pointer; padding: 2px 6px; border-radius: 8px; }
.sub { font-size: 12px; color: var(--muted); margin-top: 5px; }

/* Boutons d’ajout */
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.big { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; padding: 12px 14px; border: none; border-radius: 16px; font-size: 15px; font-weight: 650; color: #fff; cursor: pointer; box-shadow: var(--shadow); text-align: left; transition: transform .1s; }
.big:active { transform: scale(.97); }
.big .ic { font-size: 22px; line-height: 1; }
.big.argent { background: var(--g-argent); color: #3a2a00; }
.big.etude { background: var(--g-etude); color: #06301c; }
.big.sport { background: var(--g-sport); color: #4a0b19; }
.addblock { width: 100%; min-height: 54px; margin-bottom: 12px; border-radius: 16px; border: 2px dashed var(--line); background: var(--surface); font-size: 15px; font-weight: 650; cursor: pointer; }
.addblock:active { transform: scale(.98); }

/* Agenda */
.wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
.cal { min-width: 720px; display: grid; grid-template-columns: 46px repeat(7, 1fr); }
.head { font-weight: 600; font-size: 13px; text-align: center; padding: 8px 2px; border-bottom: 1px solid var(--line); background: var(--surface); }
.head.today { background: var(--today); }
.head small { display: block; color: var(--muted); font-weight: 400; }
.times { position: relative; height: 640px; }
.times span { position: absolute; right: 6px; font-size: 11px; color: var(--muted); transform: translateY(-6px); }
.col { position: relative; height: 640px; border-left: 1px solid var(--line); background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px); background-size: 100% 40px; }
.col.today { background-color: var(--today); }
.ev { position: absolute; border-radius: 8px; padding: 3px 5px; font-size: 11px; line-height: 1.25; color: #fff; overflow: hidden; border: 1px solid rgba(0,0,0,.12); cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.ev b { display: block; font-size: 11px; padding-right: 22px; }
.ev .room { display:block; margin-top:2px; font-size:10px; line-height:1.15; opacity:.9; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ev.cours { background: var(--cours); } .ev.etude { background: var(--etude); } .ev.argent { background: var(--argent); } .ev.sport { background: var(--sport); }
.ev.over { outline: 2px solid var(--warn); outline-offset: -2px; }
.ev.done { opacity: .55; }
.chk { position: absolute; top: 2px; right: 2px; width: 24px; height: 24px; padding: 0; border: 1.5px solid rgba(255,255,255,.95); border-radius: 7px; background: rgba(255,255,255,.12); color: #222; font-size: 14px; line-height: 1; font-weight: 800; cursor: pointer; touch-action: manipulation; }
.ev.done .chk { background: #fff; }
.scell { padding: 4px 3px; border-left: 1px solid var(--line); background: var(--surface); }
.scell.first { border-left: none; }
.scell.today { background: var(--today); }
.srow-top { border-bottom: 1px solid var(--line); }
.srow-bottom { border-top: 1px solid var(--line); }
.sl { display: block; width: 100%; min-height: 38px; padding: 4px 3px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--muted); font-size: 11px; font-weight: 650; line-height: 1.2; cursor: pointer; text-align: center; touch-action: manipulation; }
.sl.on { background: linear-gradient(90deg, #5b5bd6, #a78bfa); border-color: #6a63e0; color: #fff; }

/* Avatar */
.avhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.avhead b { font-size: 16px; }
.avstatus { font-size: 12px; font-weight: 650; padding: 4px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); }
.avstage { border-radius: 14px; overflow: hidden; line-height: 0; border: 1px solid #1f4a58; }
.avbadges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.avbadge { background: var(--bg); border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 650; }
.avbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.big.alt { background: var(--bg); color: var(--text); box-shadow: none; border: 1px solid var(--line); }
.sheet.wide { max-width: 600px; }
.wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
.wcard { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--bg); cursor: pointer; padding: 0; text-align: left; }
.wcard.sel { border-color: #3b6fd8; box-shadow: 0 0 0 2px rgba(59,111,216,.35); }
.wcard .wt { padding: 8px 10px 10px; font-size: 12px; color: var(--muted); }
.wcard .wt b { display: block; color: var(--text); font-size: 14px; }
.wcard .wst { margin-top: 5px; line-height: 1.5; }
.avprev { border-radius: 14px; overflow: hidden; line-height: 0; margin-bottom: 6px; border: 1px solid #1f4a58; }
.seg { display: flex; gap: 6px; margin-bottom: 10px; }
.seg button { flex: 1; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; cursor: pointer; }
.seg button.sel { background: #3b6fd8; border-color: #3b6fd8; color: #fff; }
.sw-row { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--line); cursor: pointer; padding: 0; }
.sw.sel { box-shadow: 0 0 0 3px #3b6fd8; }
.opt { height: 38px; padding: 0 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); font-size: 14px; cursor: pointer; }
.opt.sel { background: #3b6fd8; border-color: #3b6fd8; color: #fff; }
.avstage canvas, .avprev canvas, .wcard canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
.avstage, .avprev { background: #07141b; }
.wcard { background: #07141b; }
.wcard .wt { background: var(--bg); }

/* Historique */
.hrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.hrow:last-child { border-bottom: none; }
.hrow small { color: var(--muted); display: block; font-size: 12px; }
.hdel { border: none; background: var(--bg); width: 34px; height: 34px; border-radius: 10px; font-size: 15px; cursor: pointer; flex: none; }

/* Fenêtres */
.modal { position: fixed; inset: 0; background: rgba(10,14,22,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
.modal[hidden] { display: none; }
.sheet { background: var(--surface); width: 100%; max-width: 480px; border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 92vh; overflow: auto; }
@media (min-width: 600px) { .modal { align-items: center; } .sheet { border-radius: 22px; } }
.sheet h2 { font-size: 18px; margin: 0 0 14px; display: flex; justify-content: space-between; align-items: center; }
.x { border: none; background: var(--bg); width: 36px; height: 36px; border-radius: 12px; font-size: 18px; cursor: pointer; }
.sheet label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
.sheet input, .sheet select { width: 100%; height: 48px; padding: 0 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--text); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tbtn { height: 56px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg); font-size: 14px; font-weight: 650; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.tbtn.sel.etude { background: var(--etude); border-color: var(--etude); color: #fff; }
.tbtn.sel.argent { background: var(--argent); border-color: var(--argent); color: #fff; }
.tbtn.sel.sport { background: var(--sport); border-color: var(--sport); color: #fff; }
.chips { display: flex; gap: 8px; margin-top: 8px; }
.chip { flex: 1; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; cursor: pointer; }
.net { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--bg); font-size: 15px; display: flex; justify-content: space-between; }
.net b { font-size: 17px; }
.btns { display: flex; gap: 10px; margin-top: 18px; }
.btn { flex: 1; height: 52px; border-radius: 14px; border: none; font-size: 16px; font-weight: 650; cursor: pointer; background: var(--bg); }
.btn.primary { background: #3b6fd8; color: #fff; }
.btn.danger { background: #fde8e6; color: #b3261e; }
.err { color: var(--warn); font-size: 13px; margin-top: 10px; min-height: 16px; }

@media (max-width: 640px) {
  .actions { grid-template-columns: 1fr; }
  .big { justify-content: flex-start; }
}

/* ===== Thème Linear (d'après le DESIGN.md de Linear) ===== */
body { font-family: Inter, "SF Pro Display", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; font-feature-settings: "cv01", "ss03"; -webkit-font-smoothing: antialiased; }
h1 { font-size: 22px; font-weight: 590; letter-spacing: -0.5px; }
#sync { background: transparent; font-size: 11px; font-weight: 510; }
.card { border-radius: 12px; border: 1px solid rgba(255,255,255,.06); }
.lvl { font-weight: 590; letter-spacing: -0.2px; }
.pbar { height: 10px; background: rgba(255,255,255,.06); }
.pbar i { box-shadow: none; }
.xpcard .pbar { height: 8px; }
.reward { border: 1px dashed rgba(255,255,255,.12); border-radius: 8px; color: var(--text); }
.reward::placeholder { color: var(--muted); }
.weeknav { grid-template-columns: 48px 1fr 48px; }
.weeknav button { height: 48px; font-size: 22px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; box-shadow: none; color: var(--text); }
.weeklabel b { font-weight: 590; letter-spacing: -0.4px; }
.weeknav .todaybtn { height: auto; font-size: 12px; font-weight: 510; background: rgba(94,106,210,.14); border-color: rgba(113,112,255,.4); color: #c3c8ff; }
.objname { font-weight: 510; }
.big { min-height: 54px; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; box-shadow: none; font-weight: 510; background: rgba(255,255,255,.03); color: var(--text); }
.big.argent { background: rgba(196,145,44,.12); border-color: rgba(196,145,44,.35); color: #f2d9a0; }
.big.etude { background: rgba(63,158,114,.12); border-color: rgba(63,158,114,.35); color: #a8e6c8; }
.big.sport { background: rgba(208,88,122,.12); border-color: rgba(208,88,122,.35); color: #f5b0c3; }
.big.alt { background: rgba(255,255,255,.03); color: var(--text); }
.addblock { border: 1px dashed rgba(255,255,255,.14); border-radius: 10px; background: transparent; color: var(--muted); font-weight: 510; }
.wrap { border-radius: 12px; border: 1px solid rgba(255,255,255,.06); }
.head { font-weight: 510; }
.head.today { background: rgba(94,106,210,.16); color: #c3c8ff; }
.col { background-image: linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px); }
.col.today { background-color: rgba(94,106,210,.07); }
.ev { color: #e8eaed; border: 1px solid rgba(255,255,255,.08); border-left-width: 3px; border-radius: 6px; }
.ev b { font-weight: 510; }
.ev.cours { background: rgba(94,106,210,.22); border-left-color: #7170ff; }
.ev.etude { background: rgba(63,158,114,.20); border-left-color: #3f9e72; }
.ev.argent { background: rgba(196,145,44,.20); border-left-color: #c4912c; }
.ev.sport { background: rgba(208,88,122,.20); border-left-color: #d0587a; }
.ev.over { outline: 1px solid var(--warn); outline-offset: -1px; }
.chk { border: 1.5px solid rgba(255,255,255,.35); background: transparent; color: #fff; border-radius: 6px; }
.ev.done .chk { background: var(--accent); border-color: var(--accent); }
.scell.today { background: rgba(94,106,210,.07); }
.sl { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; font-weight: 510; }
.sl.on { background: rgba(94,106,210,.25); border-color: rgba(113,112,255,.6); color: #dfe2ff; }
.avstatus { background: rgba(255,255,255,.05); }
.avbadge { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06); font-weight: 510; }
.avstage, .avprev { border-color: rgba(255,255,255,.08); }
.modal { background: rgba(0,0,0,.62); }
.sheet { background: var(--raised); border: 1px solid rgba(255,255,255,.08); }
.sheet h2 { font-weight: 590; letter-spacing: -0.3px; }
.x { background: rgba(255,255,255,.05); color: var(--text); }
.sheet input, .sheet select { background: var(--bg); color: var(--text); border: 1px solid rgba(255,255,255,.1); border-radius: 8px; }
.sheet input:focus, .sheet select:focus { outline: none; border-color: var(--accent-ui); box-shadow: 0 0 0 3px rgba(113,112,255,.25); }
.tbtn, .chip, .opt, .seg button { background: rgba(255,255,255,.03); border-color: rgba(255,255,255,.1); color: var(--text); }
.tbtn { border-width: 1px; border-radius: 10px; }
.net { background: rgba(255,255,255,.04); border-radius: 10px; }
.btn { background: rgba(255,255,255,.06); color: var(--text); border-radius: 10px; font-weight: 510; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.danger { background: rgba(229,89,77,.14); color: #ff9a92; }
.hdel { background: rgba(255,255,255,.05); color: var(--text); }
.wcard { border-color: rgba(255,255,255,.08); border-radius: 12px; }
.wcard.sel { border-color: var(--accent-ui); box-shadow: 0 0 0 2px rgba(113,112,255,.35); }
.seg button.sel, .opt.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
.sw.sel { box-shadow: 0 0 0 3px var(--accent-ui); }

/* ===== Refonte v3 : app moderne (glass, anneaux, onglets) ===== */
[hidden] { display: none !important; }
:root { padding-top: 0; padding-bottom: 0; }
body { padding: 0 0 calc(112px + env(safe-area-inset-bottom, 0px)); max-width: 860px; }
main { padding: 0 16px; }
.aurora { position: fixed; z-index: -1; inset: -10% -20% auto -20%; height: 62vh; pointer-events: none;
  background: radial-gradient(55% 55% at 22% 0%, rgba(94,106,210,.38), transparent 70%), radial-gradient(45% 45% at 88% 8%, rgba(208,88,122,.20), transparent 70%), radial-gradient(40% 40% at 60% 30%, rgba(63,158,114,.10), transparent 70%);
  filter: blur(34px); }
.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.i.s { width: 15px; height: 15px; }

/* En-tête collant */
.appbar { position: sticky; top: 0; z-index: 30; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
  background: linear-gradient(rgba(8,9,10,.86), rgba(8,9,10,.66)); -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
  border-bottom: 1px solid rgba(255,255,255,.05); }
.ab-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.ab-date { display: block; font-size: 11px; font-weight: 590; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.appbar h1 { font-size: 30px; font-weight: 650; letter-spacing: -1px; line-height: 1.05; margin: 0; }
.ab-row .todaybtn { margin: 0 0 4px; padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 590; color: #d7daff;
  background: rgba(94,106,210,.2); border: 1px solid rgba(113,112,255,.5); cursor: pointer; }
.appbar .weeknav { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; margin: 12px 0 0; }
.appbar .weeknav button { height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 0; }
.appbar .weeklabel { text-align: center; }
.appbar .weeklabel b { font-size: 17px; letter-spacing: -.3px; }
.appbar .weeklabel span { font-size: 12.5px; }

/* Barre d'onglets flottante + bouton + */
.tabbar { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  width: min(92vw, 400px); height: 64px; display: grid; grid-template-columns: 1fr 84px 1fr; align-items: center; padding: 0 6px;
  border-radius: 32px; background: rgba(28,29,32,.72); -webkit-backdrop-filter: blur(26px) saturate(190%); backdrop-filter: blur(26px) saturate(190%);
  border: 1px solid rgba(255,255,255,.1); box-shadow: 0 14px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06); }
.tb { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 100%; border: none; background: none; color: var(--muted); font-size: 11px; font-weight: 590; cursor: pointer; transition: color .2s, transform .15s; }
.tb.on { color: var(--text); } .tb.on .i { color: var(--accent-ui); }
.tb:active { transform: scale(.94); }
.fab { width: 58px; height: 58px; margin: 0 auto; border-radius: 50%; border: none; color: #fff; display: grid; place-items: center; cursor: pointer; transform: translateY(-12px);
  background: linear-gradient(145deg, #8685ff, #5e6ad2 60%, #4b55b8); box-shadow: 0 10px 26px rgba(94,106,210,.6), inset 0 1px 0 rgba(255,255,255,.35); transition: transform .15s; }
.fab .i { width: 26px; height: 26px; stroke-width: 2.2; }
.fab:active { transform: translateY(-12px) scale(.92); }

/* Onglets */
.tab { display: none; }
.tab.on { display: block; animation: tabin .38s cubic-bezier(.2,.8,.2,1); }
@keyframes tabin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* Sélecteur Jour / Semaine */
.viewbar { display: flex; justify-content: center; margin: 16px 0 12px; }
.seg2 { position: relative; display: grid; grid-template-columns: 1fr 1fr; width: 214px; padding: 3px; border-radius: 13px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); }
.seg2 button { position: relative; z-index: 1; height: 34px; border: none; background: none; color: var(--muted); font-size: 13px; font-weight: 590; cursor: pointer; transition: color .2s; }
.seg2[data-v="day"] button[data-v="day"], .seg2[data-v="week"] button[data-v="week"] { color: var(--text); }
.seg2 .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 10px; background: rgba(255,255,255,.11); box-shadow: 0 1px 6px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.08); transition: transform .28s cubic-bezier(.3,.9,.3,1); }
.seg2[data-v="week"] .thumb { transform: translateX(100%); }

/* Bandeau des jours */
.daystrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 14px; }
.dpill { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 0 8px; border-radius: 18px; border: 1px solid rgba(255,255,255,.05); background: rgba(255,255,255,.03); color: var(--muted); cursor: pointer; transition: transform .15s, background .2s; }
.dpill:active { transform: scale(.94); }
.dpill small { font-size: 10px; font-weight: 590; letter-spacing: .06em; text-transform: uppercase; }
.dpill b { font-size: 18px; font-weight: 650; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
.dpill.today b { color: #c3c8ff; }
.dpill.sel { background: linear-gradient(180deg, #7473ff, #5e6ad2); border-color: rgba(255,255,255,.22); box-shadow: 0 8px 22px rgba(94,106,210,.45); }
.dpill.sel small, .dpill.sel b { color: #fff; }
.dots { display: flex; gap: 3px; height: 5px; }
.dot { width: 5px; height: 5px; border-radius: 50%; background: #666; }
.dot.etude { background: #3f9e72; } .dot.cours { background: #8b8aff; } .dot.argent { background: #d6a33a; } .dot.sport { background: #e0688a; }
.dpill.sel .dot { box-shadow: 0 0 0 1px rgba(255,255,255,.75); }

/* Agenda */
.wrap { border-radius: 22px; background: rgba(255,255,255,.025); border: 1px solid rgba(255,255,255,.07); box-shadow: 0 10px 40px rgba(0,0,0,.35); }
.times, .col { height: var(--ht, 640px); }
.col { background-size: 100% var(--hh, 40px); }
.times span { font-variant-numeric: tabular-nums; }
.cal.day { min-width: 0; grid-template-columns: 52px 1fr; }
.cal.day .ev { font-size: 13px; padding: 9px 12px; border-radius: 14px; border-left-width: 4px; }
.cal.day .ev b { font-size: 14.5px; font-weight: 590; padding-right: 34px; }
.cal.day .chk { width: 30px; height: 30px; top: 8px; right: 8px; border-radius: 10px; font-size: 16px; }
.ev { transition: transform .12s; }
.ev:active { transform: scale(.985); }
.ev.etude { background: linear-gradient(135deg, rgba(63,158,114,.34), rgba(63,158,114,.14)); }
.ev.cours { background: linear-gradient(135deg, rgba(113,112,255,.36), rgba(94,106,210,.14)); }
.ev.argent { background: linear-gradient(135deg, rgba(196,145,44,.34), rgba(196,145,44,.13)); }
.ev.sport { background: linear-gradient(135deg, rgba(208,88,122,.34), rgba(208,88,122,.14)); }
.now { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid #ff5a6a; z-index: 6; pointer-events: none; }
.now::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: #ff5a6a; box-shadow: 0 0 0 4px rgba(255,90,106,.28); }
.sl { display: flex; align-items: center; justify-content: center; gap: 6px; }
.sl .i { width: 15px; height: 15px; }
.cal.day .sl { min-height: 44px; font-size: 13px; border-radius: 14px; }

/* Cartes / Progrès */
.card { border-radius: 24px; padding: 18px; background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.018)); border: 1px solid rgba(255,255,255,.07); margin-top: 16px; }
.hero { margin-top: 16px; }
.avhead b { font-size: 17px; font-weight: 650; letter-spacing: -.3px; }
.avstage { border-radius: 18px; }
.avbadge { display: inline-flex; align-items: center; gap: 6px; }
.avbadge .i { width: 15px; height: 15px; color: var(--accent-ui); }
.avbtns .big { gap: 8px; min-height: 48px; }
.xpcard .lvl { font-size: 18px; }
.rewardbox { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 0 14px; border-radius: 14px; border: 1px dashed rgba(255,255,255,.16); color: var(--muted); }
.rewardbox .rwi { flex: 1; min-width: 0; height: 46px; border: none; background: none; color: var(--text); font: inherit; font-size: 14px; outline: none; }
.rewardbox .rwi::placeholder { color: var(--muted); }
.bento { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.tile { --tc: #5e6ad2; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 14px 14px 16px; border-radius: 24px; border: 1px solid rgba(255,255,255,.07);
  background: radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--tc) 22%, transparent), transparent 62%), linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.015)); }
.t-etude { --tc: #3f9e72; } .t-sport { --tc: #d0587a; } .t-sleep { --tc: #7170ff; } .t-argent { --tc: #d6a33a; }
.tl-top { display: flex; justify-content: space-between; align-items: center; min-height: 26px; }
.tl-name { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 590; color: var(--text); }
.tl-name .i { width: 17px; height: 17px; color: var(--tc); }
.tile .edit { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border-radius: 9px; background: rgba(255,255,255,.05); color: var(--muted); border: none; cursor: pointer; }
.ring { position: relative; width: 96px; height: 96px; margin: 4px auto 2px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring circle { fill: none; stroke-width: 4.4; }
.ring .rt { stroke: rgba(255,255,255,.07); }
.ring .rf { stroke-linecap: round; stroke-dasharray: 0 113.1; opacity: 0; transition: stroke-dasharray 1s cubic-bezier(.22,1,.36,1), opacity .3s; filter: drop-shadow(0 0 4px color-mix(in srgb, var(--tc) 70%, transparent)); }
.rp { position: absolute; inset: 0; display: grid; place-items: center; font-size: 20px; font-weight: 650; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.tl-val { text-align: center; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-val b { color: var(--text); font-size: 15px; font-weight: 650; }
.tl-sub { text-align: center; font-size: 11px; color: var(--muted); }
.tl-sub:empty { display: none; }
.foot { text-align: center; margin: 18px 0 8px; }
#sync { display: inline-block; font-size: 11px; font-weight: 510; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; background: none; }

/* Fenêtres (sheets) */
.modal { -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.sheet { border-radius: 28px 28px 0 0; background: rgba(26,27,30,.94); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); animation: sheetin .32s cubic-bezier(.2,.9,.25,1); }
.sheet::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.2); margin: -6px auto 14px; }
@media (min-width: 600px) { .sheet { border-radius: 28px; } }
@keyframes sheetin { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.x .i { width: 18px; height: 18px; }
.x { display: grid; place-items: center; }
.qlist { display: flex; flex-direction: column; gap: 8px; }
.qrow { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 14px 12px 12px; border-radius: 18px; border: 1px solid rgba(255,255,255,.07); background: rgba(255,255,255,.04); color: var(--text); text-align: left; cursor: pointer; transition: transform .12s; }
.qrow:active { transform: scale(.98); }
.qrow > .i { color: var(--muted); width: 18px; height: 18px; }
.qi { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; }
.q-bloc { background: rgba(94,106,210,.22); color: #b6bbff; } .q-gains { background: rgba(196,145,44,.22); color: #f0cf85; }
.q-etude { background: rgba(63,158,114,.22); color: #9be3c0; } .q-sport { background: rgba(208,88,122,.22); color: #f5adc1; }
.qt { flex: 1; display: flex; flex-direction: column; gap: 1px; }
.qt b { font-size: 15.5px; font-weight: 590; } .qt small { font-size: 12.5px; color: var(--muted); }
.tbtn .i { width: 22px; height: 22px; }
.wst .i { width: 13px; height: 13px; vertical-align: -2px; }
.hrow .i { width: 15px; height: 15px; vertical-align: -3px; margin-right: 4px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Célébration plein écran à chaque ajout de progression */
.action-celebration { position: fixed; inset: 0; z-index: 99999; pointer-events: none; overflow: hidden; animation: action-screen-glow 1.15s ease-out both; }
.action-celebration::before { content:""; position:absolute; inset:0; background: radial-gradient(ellipse at center, var(--action-glow), transparent 72%); animation: action-screen-pulse 1.15s ease-out both; }
.action-celebration .action-label { position:absolute; top: 17%; left:50%; transform:translate(-50%,-10px) scale(.8); padding:12px 18px; border:1px solid var(--action-border); border-radius:999px; background:rgba(10,12,16,.78); color:#fff; font-size:clamp(14px,2.5vw,20px); font-weight:750; box-shadow:0 0 36px var(--action-glow); white-space:nowrap; animation: action-label-pop 1.25s cubic-bezier(.2,.8,.25,1) both; }
.action-particle { position:absolute; left:var(--x); top:-9vh; font-size:var(--size); line-height:1; filter:drop-shadow(0 3px 9px rgba(0,0,0,.25)); animation: action-rain var(--dur) var(--delay) linear both; }
.action-celebration.argent { --action-glow:rgba(239,190,57,.32); --action-border:rgba(255,215,100,.6); }
.action-celebration.sleep { --action-glow:rgba(135,147,255,.32); --action-border:rgba(166,176,255,.6); }
.action-celebration.etude { --action-glow:rgba(63,200,127,.34); --action-border:rgba(110,239,170,.65); }
.action-celebration.sport { --action-glow:rgba(239,89,139,.32); --action-border:rgba(255,140,176,.65); }
@keyframes action-screen-glow { 0%{background:transparent} 18%{background:var(--action-glow)} 100%{background:transparent} }
@keyframes action-screen-pulse { 0%{opacity:0;transform:scale(.65)} 22%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(1.3)} }
@keyframes action-label-pop { 0%{opacity:0;transform:translate(-50%,-10px) scale(.8)} 18%{opacity:1;transform:translate(-50%,0) scale(1.04)} 75%{opacity:1;transform:translate(-50%,0) scale(1)} 100%{opacity:0;transform:translate(-50%,-8px) scale(.98)} }
@keyframes action-rain { 0%{transform:translate3d(0,-5vh,0) rotate(0) scale(.7);opacity:0} 10%{opacity:1} 100%{transform:translate3d(var(--drift),115vh,0) rotate(var(--spin)) scale(1.12);opacity:0} }
@media (prefers-reduced-motion: reduce) { .action-celebration, .action-celebration * { animation-duration:.01ms !important; } }

/* Célébrations distinctes quand un objectif passe à 100 % */
.goal-celebration {
  position: absolute; inset: 0; z-index: 5; overflow: hidden; pointer-events: none;
  border-radius: inherit; isolation: isolate;
}
.goal-celebration::before {
  content: ""; position: absolute; inset: 0; opacity: 0;
  animation: goal-flash .8s ease-out both;
}
.goal-celebration .goal-message {
  position: absolute; z-index: 3; left: 50%; top: 47%; transform: translate(-50%,-50%) scale(.7);
  white-space: nowrap; padding: 7px 12px; border-radius: 999px; font-size: 12px; font-weight: 800;
  color: #fff; background: rgba(12,14,18,.82); border: 1px solid rgba(255,255,255,.24);
  box-shadow: 0 5px 24px rgba(0,0,0,.28); opacity: 0; animation: goal-message .95s .12s cubic-bezier(.2,.9,.25,1) both;
}
.goal-particle { position: absolute; top: -28px; left: var(--x); font-size: var(--size); line-height: 1;
  filter: drop-shadow(0 3px 5px rgba(0,0,0,.25)); will-change: transform, opacity; }
.goal-celebration.money { background: radial-gradient(ellipse at 50% 15%, rgba(245,193,55,.24), transparent 68%); }
.goal-celebration.money .goal-particle { animation: money-rain var(--dur) var(--delay) cubic-bezier(.35,.03,.7,.5) infinite; }
.goal-celebration.money::before { background: linear-gradient(115deg, transparent 25%, rgba(255,224,118,.18), transparent 70%); }
.goal-celebration.sleep { background: radial-gradient(ellipse at 50% 55%, rgba(135,147,255,.25), transparent 70%); }
.goal-celebration.sleep .goal-particle { animation: sleep-drift var(--dur) var(--delay) ease-in-out infinite; }
.goal-celebration.study { background: radial-gradient(ellipse at 50% 55%, rgba(92,224,157,.2), transparent 70%); }
.goal-celebration.study .goal-particle { top: auto; bottom: -28px; animation: study-burst var(--dur) var(--delay) cubic-bezier(.16,.8,.3,1) infinite; }
.goal-celebration.sport { background: radial-gradient(ellipse at 50% 60%, rgba(255,91,139,.24), transparent 70%); }
.goal-celebration.sport .goal-particle { top: auto; bottom: -30px; animation: sport-burst var(--dur) var(--delay) cubic-bezier(.15,.75,.25,1) infinite; }
.t-argent.goal-celebrating { animation: money-tile .8s ease-out; }
.t-sleep.goal-celebrating { animation: sleep-tile 1.2s ease-out; }
.t-etude.goal-celebrating { animation: study-tile .8s ease-out; }
.t-sport.goal-celebrating { animation: sport-tile .75s ease-out; }
@keyframes goal-flash { 0%{opacity:0} 18%{opacity:1} 100%{opacity:0} }
@keyframes goal-message { 0%{opacity:0;transform:translate(-50%,-50%) scale(.65)} 25%{opacity:1;transform:translate(-50%,-50%) scale(1.08)} 75%{opacity:1;transform:translate(-50%,-50%) scale(1)} 100%{opacity:0;transform:translate(-50%,-62%) scale(.96)} }
@keyframes money-rain { 0%{transform:translate3d(0,-25px,0) rotate(-25deg);opacity:0} 10%{opacity:1} 75%{opacity:1} 100%{transform:translate3d(var(--drift),260px,0) rotate(var(--spin));opacity:0} }
@keyframes sleep-drift { 0%{transform:translate3d(0,-15px,0) rotate(-12deg) scale(.7);opacity:0} 18%{opacity:1} 65%{opacity:.95} 100%{transform:translate3d(var(--drift),220px,0) rotate(20deg) scale(1.12);opacity:0} }
@keyframes study-burst { 0%{transform:translate3d(0,0,0) rotate(-20deg) scale(.45);opacity:0} 18%{opacity:1} 70%{opacity:1} 100%{transform:translate3d(var(--drift),var(--rise),0) rotate(var(--spin)) scale(1.05);opacity:0} }
@keyframes sport-burst { 0%{transform:translate3d(0,0,0) rotate(0) scale(.55);opacity:0} 18%{opacity:1} 70%{opacity:1} 100%{transform:translate3d(var(--drift),var(--rise),0) rotate(var(--spin)) scale(1.15);opacity:0} }
@keyframes money-tile { 0%,100%{box-shadow:0 0 0 rgba(240,190,55,0)} 35%{box-shadow:0 0 0 2px rgba(240,190,55,.5),0 0 30px rgba(240,190,55,.22)} }
@keyframes sleep-tile { 0%,100%{box-shadow:0 0 0 rgba(135,147,255,0)} 35%{box-shadow:0 0 0 2px rgba(135,147,255,.45),0 0 30px rgba(135,147,255,.2)} }
@keyframes study-tile { 0%,100%{box-shadow:0 0 0 rgba(92,224,157,0)} 35%{box-shadow:0 0 0 2px rgba(92,224,157,.45),0 0 30px rgba(92,224,157,.2)} }
@keyframes sport-tile { 0%,100%{transform:translateX(0);box-shadow:0 0 0 rgba(255,91,139,0)} 20%{transform:translateX(-2px)} 40%{transform:translateX(2px);box-shadow:0 0 0 2px rgba(255,91,139,.45),0 0 30px rgba(255,91,139,.2)} 60%{transform:translateX(-1px)} 80%{transform:translateX(1px)} }
@media (prefers-reduced-motion: reduce) {
  .goal-celebration, .goal-celebration *, .goal-celebration::before, .goal-celebrating { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}


/* ===== Couche d'animations ===== */
.appbar { animation: barDown .6s cubic-bezier(.2,.8,.2,1) both; }
.tabbar { animation: barUp .6s .12s cubic-bezier(.2,.8,.2,1) both; }
@keyframes barDown { from { transform: translateY(-100%); } to { transform: none; } }
@keyframes barUp { from { transform: translate(-50%, 120%); } to { transform: translateX(-50%); } }
.ab-row .todaybtn { animation: pin .45s cubic-bezier(.34,1.7,.5,1); }
@keyframes pin { from { transform: scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }
.weeklabel.fr { animation: lblR .4s cubic-bezier(.2,.8,.2,1); }
.weeklabel.fl { animation: lblL .4s cubic-bezier(.2,.8,.2,1); }
@keyframes lblR { from { transform: translateX(18px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes lblL { from { transform: translateX(-18px); opacity: 0; } to { transform: none; opacity: 1; } }
.weeknav button { transition: transform .15s, background .2s; }
.weeknav button:active { transform: scale(.85); }

/* onglets : contenu qui monte en cascade */
.tab.on > * { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
.tab.on > :nth-child(2) { animation-delay: .06s; } .tab.on > :nth-child(3) { animation-delay: .12s; }
.tab.on > :nth-child(4) { animation-delay: .18s; } .tab.on > :nth-child(5) { animation-delay: .24s; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.tb { position: relative; }
.tb::after { content: ""; position: absolute; top: 6px; left: 50%; width: 26px; height: 3px; border-radius: 3px; background: var(--accent-ui); transform: translateX(-50%) scaleX(0); transition: transform .35s cubic-bezier(.34,1.5,.5,1); }
.tb.on::after { transform: translateX(-50%) scaleX(1); }
.tb.on .i { animation: tabpop .5s cubic-bezier(.34,1.8,.5,1); }
@keyframes tabpop { from { transform: scale(.6) rotate(-12deg); } to { transform: none; } }
.fab::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent-ui); animation: fabring 3.2s 1.2s ease-out infinite; pointer-events: none; }
@keyframes fabring { 0% { transform: scale(1); opacity: .55; } 65%, 100% { transform: scale(1.55); opacity: 0; } }
.fab { animation: fabin .7s .3s cubic-bezier(.34,1.6,.5,1) both; }
@keyframes fabin { from { transform: translateY(40px) scale(.3); opacity: 0; } to { transform: translateY(-12px); opacity: 1; } }
.fab .i { transition: transform .4s cubic-bezier(.34,1.6,.5,1); }
.fab:active .i { transform: rotate(90deg); }

/* bandeau des jours : pastille qui glisse */
.dswrap { position: relative; margin-bottom: 14px; }
.dswrap .daystrip { position: relative; margin-bottom: 0; }
.dthumb { position: absolute; z-index: 0; top: 0; left: 0; width: 0; height: 0; border-radius: 18px; background: linear-gradient(180deg, #7473ff, var(--accent)); box-shadow: 0 8px 22px rgba(94,106,210,.45);
  transition: transform .5s cubic-bezier(.34,1.4,.5,1), width .3s, height .3s; pointer-events: none; }
.dpill { position: relative; z-index: 1; }
.dpill.sel { background: transparent; border-color: transparent; box-shadow: none; }

/* calendrier : glissement directionnel + blocs en cascade */
.cal.in-r { animation: slideR .5s cubic-bezier(.2,.8,.2,1); }
.cal.in-l { animation: slideL .5s cubic-bezier(.2,.8,.2,1); }
.cal.in-0 { animation: fadein .4s ease; }
.cal.in-r .ev, .cal.in-l .ev, .cal.in-0 .ev { animation: evpop .55s cubic-bezier(.2,.9,.3,1) both; animation-delay: calc(var(--i, 0) * 40ms); }
@keyframes slideR { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
@keyframes slideL { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
@keyframes evpop { from { opacity: 0; transform: scale(.92) translateY(10px); } to { opacity: 1; transform: none; } }
.ev.just .chk { animation: chkpop .5s cubic-bezier(.34,1.8,.5,1); }
@keyframes chkpop { 0% { transform: scale(.4); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }
.sl { transition: background .25s, color .25s, border-color .25s, transform .15s; }
.sl:active { transform: scale(.95); }
.dpill, .tile, .qrow, .big, .btn, .chip, .tbtn, .hdel, .x { transition: transform .15s, background .2s, border-color .2s, color .25s; }
.dpill:active, .qrow:active, .big:active, .btn:active, .chip:active, .tbtn:active, .hdel:active { transform: scale(.95); }
.x:active { transform: rotate(90deg) scale(.88); }
.sw { transition: transform .2s cubic-bezier(.34,1.6,.5,1); }
.sw.sel { transform: scale(1.08); }

/* heure actuelle : point qui pulse + étiquette */
.now::before { animation: ping 2.4s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(113,112,255,.45); } 80%, 100% { box-shadow: 0 0 0 11px rgba(113,112,255,0); } }
.nowlbl { position: absolute; right: 6px; top: -11px; padding: 0 8px; border-radius: 8px; background: var(--raised); border: 1px solid rgba(255,255,255,.1); color: var(--text); font-size: 11px; font-weight: 500; line-height: 20px; font-variant-numeric: tabular-nums; }

/* progrès : barre qui brille, anneau plein qui respire, niveau qui saute */
.pbar i { position: relative; overflow: hidden; transition: width 1.1s cubic-bezier(.22,1,.36,1); }
.pbar i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent); transform: translateX(-100%); animation: shine 3s ease-in-out infinite; }
@keyframes shine { 0% { transform: translateX(-100%); } 55%, 100% { transform: translateX(100%); } }
.ring .rf { transition: stroke-dasharray 1.2s cubic-bezier(.22,1,.36,1), opacity .3s; }
.ring.full .rf { animation: ringglow 1.9s ease-in-out infinite; }
@keyframes ringglow { 0%, 100% { filter: drop-shadow(0 0 2px color-mix(in srgb, var(--tc) 60%, transparent)); } 50% { filter: drop-shadow(0 0 8px var(--tc)); } }
.lvl { transform-origin: left center; }
.lvl.lvlup { animation: lvlpop .9s cubic-bezier(.34,1.8,.5,1); }
@keyframes lvlpop { 0% { transform: scale(1); } 35% { transform: scale(1.18); color: var(--accent-ui); } 100% { transform: scale(1); } }
.rp { font-variant-numeric: tabular-nums; }

/* fenêtres et listes */
.sheet { animation: sheetin .42s cubic-bezier(.2,.9,.25,1.03); }
@keyframes sheetin { from { transform: translateY(50px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal { animation: fadein .25s ease; }
.qrow { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
.qrow:nth-child(2) { animation-delay: .06s; } .qrow:nth-child(3) { animation-delay: .12s; } .qrow:nth-child(4) { animation-delay: .18s; }
.wcard { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 35ms); }
.hrow { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ===== XP ×2 et sélecteur de durée ===== */
.ring .rx { fill: none; stroke: #ffd66b; stroke-width: 4.6; stroke-linecap: round; opacity: 0; transition: stroke-dasharray 1.2s cubic-bezier(.22,1,.36,1), opacity .3s; filter: drop-shadow(0 0 4px rgba(255,214,107,.85)); }
.tile.bonus { border-color: rgba(255,214,107,.42); box-shadow: 0 0 24px rgba(255,214,107,.14); }
.x2 { display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .2px; color: #3a2a00; background: linear-gradient(90deg, #ffd66b, #ffeeb0); animation: pin .45s cubic-bezier(.34,1.7,.5,1); }
.x2txt { color: #ffd66b; font-weight: 700; }
.picker { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; height: 220px; margin-top: 4px; }
.pk-band { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 214px; height: 44px; border-radius: 12px; background: rgba(255,255,255,.06); border: 1px solid var(--line2, #34343a); pointer-events: none; }
.wcol { position: relative; width: 100px; height: 220px; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain; padding: 88px 0;
  -webkit-mask-image: linear-gradient(transparent, #000 26%, #000 74%, transparent); mask-image: linear-gradient(transparent, #000 26%, #000 74%, transparent); }
.wcol::-webkit-scrollbar { display: none; }
.wi { height: 44px; display: flex; align-items: center; justify-content: center; scroll-snap-align: center; font-size: 24px; font-weight: 600; color: var(--faint, #62666d); font-variant-numeric: tabular-nums; cursor: pointer; user-select: none; -webkit-user-select: none; transition: color .2s, transform .2s; }
.wi.on { color: var(--text); transform: scale(1.1); }
.pk-u { width: 28px; font-size: 15px; font-weight: 500; color: var(--muted); }

.sl-name { display: block; margin-top: 2px; font-size: 12px; font-weight: 600; color: #a8b0ff; }

.ab-right { display: flex; align-items: flex-end; gap: 8px; }
.sndbtn { width: 38px; height: 38px; display: grid; place-items: center; margin: 0 0 3px; padding: 0; border-radius: 12px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); color: var(--text); cursor: pointer; transition: transform .15s, background .2s, color .2s; }
.sndbtn:active { transform: scale(.88); }
.sndbtn.off { color: var(--muted); }

<script>
/* =====================================================================
   SFX — effets sonores synthétisés (Web Audio), un son distinct par action
   Aucun fichier audio : tout est généré par des oscillateurs et du bruit.
   ===================================================================== */
var SFX = (function () {
  var ctx = null, master = null, bus = null, noiseBuf = null, enabled = true, last = {};
  var GAIN = {"tab_agenda": 4.0, "tab_stats": 3.25, "prev": 10.22, "next": 12.37, "today": 3.0, "day": 6.42, "view": 5.63, "page": 5.83, "fab": 8.96, "sheet": 11.59, "close": 10.45, "pick": 7.93, "save": 3.15, "tick": 6.9, "del": 7.83, "error": 3.45, "undo": 10.93, "act_etude": 4.31, "act_sport": 1.72, "act_argent": 3.46, "wake": 3.69, "sleepy": 5.02, "levelup": 5.35, "goal_etude": 4.34, "goal_sport": 4.42, "goal_argent": 2.68, "goal_sleep": 2.93, "x2": 4.88, "tier_argent": 5.52, "tier_etude": 4.15, "tier_sport": 5.39, "tier_sleep": 7.26};   // volumes calibrés : clics discrets, récompenses plus présentes
  try { enabled = localStorage.getItem("abdoSfx") !== "off"; } catch (e) {}

  function N(m) { return 440 * Math.pow(2, (m - 69) / 12); }          // note MIDI -> Hz
  function ensure() {
    if (ctx) return ctx;
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    ctx = new AC(); buildGraph(ctx); return ctx;
  }
  function buildGraph(c) {
    var comp = c.createDynamicsCompressor(); comp.threshold.value = -10; comp.knee.value = 12; comp.ratio.value = 3; comp.attack.value = 0.003; comp.release.value = 0.2;
    master = c.createGain(); master.gain.value = 1; master.connect(comp); comp.connect(c.destination);
    var len = c.sampleRate; noiseBuf = c.createBuffer(1, len, c.sampleRate);
    var d = noiseBuf.getChannelData(0); for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }

  /* --- briques de base --- */
  function osc(type, f0, f1, t, dur, vol, o) {
    o = o || {};
    var os = ctx.createOscillator(), g = ctx.createGain(), a = o.a == null ? 0.004 : o.a, node = os;
    os.type = type; os.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) os.frequency.exponentialRampToValueAtTime(f1, t + dur * (o.slide || 1));
    if (o.det) os.detune.value = o.det;
    if (o.lp) { var f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = o.lp; os.connect(f); node = f; }
    node.connect(g);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dur);
    g.connect(bus); os.start(t); os.stop(t + a + dur + 0.03);
  }
  function noise(t, dur, vol, ft, f0, f1, q) {
    var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; f.type = ft; f.frequency.setValueAtTime(f0, t); if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur); f.Q.value = q || 1;
    s.connect(f); f.connect(g);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + Math.min(0.012, dur / 3)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(bus); s.start(t, Math.random() * 0.4); s.stop(t + dur + 0.03);
  }
  function arp(notes, t, step, type, dur, vol, o) { notes.forEach(function (n, i) { osc(type, N(n), N(n), t + i * step, dur, vol, o); }); }
  function chord(notes, t, type, dur, vol, o) { notes.forEach(function (n) { osc(type, N(n), N(n), t, dur, vol, o); }); }

  function run(name, t) { bus = ctx.createGain(); bus.gain.value = GAIN[name] == null ? 1 : GAIN[name]; bus.connect(master); L[name](t); }

  /* --- bibliothèque : un son par action --- */
  var L = {
    /* navigation */
    tab_agenda: function (t) { arp([79, 72], t, 0.06, "triangle", 0.13, 0.09); },                       // deux notes qui descendent
    tab_stats: function (t) { arp([72, 79, 84], t, 0.055, "triangle", 0.14, 0.09); },                   // trois notes qui montent
    prev: function (t) { noise(t, 0.16, 0.08, "bandpass", 2600, 500, 2.2); osc("sine", 520, 400, t, 0.07, 0.05); },
    next: function (t) { noise(t, 0.16, 0.08, "bandpass", 500, 2600, 2.2); osc("sine", 400, 520, t, 0.07, 0.05); },
    today: function (t) { osc("sine", N(84), N(84), t, 0.42, 0.1); osc("sine", N(91), N(91), t + 0.05, 0.4, 0.07); osc("sine", N(96), N(96), t + 0.05, 0.25, 0.03); },
    day: function (t) { osc("sine", N(79), N(86), t, 0.07, 0.1, { slide: 0.6 }); },
    view: function (t) { osc("square", 320, 320, t, 0.03, 0.04, { lp: 1800 }); osc("square", 500, 500, t + 0.055, 0.03, 0.04, { lp: 1800 }); },
    page: function (t) { noise(t, 0.12, 0.07, "highpass", 2400, 900, 0.8); osc("triangle", 700, 500, t, 0.05, 0.04); },
    /* fenêtres et boutons */
    fab: function (t) { osc("sine", N(76), N(88), t, 0.09, 0.1, { slide: 0.7 }); osc("sine", N(95), N(95), t + 0.05, 0.12, 0.03); },
    sheet: function (t) { noise(t, 0.16, 0.05, "bandpass", 300, 1800, 1.5); osc("sine", 360, 720, t, 0.13, 0.05); },
    close: function (t) { noise(t, 0.12, 0.05, "bandpass", 1600, 300, 1.5); osc("sine", 560, 300, t, 0.1, 0.05); },
    pick: function (t) { osc("sine", N(84), N(91), t, 0.06, 0.09, { slide: 0.6 }); },
    save: function (t) { arp([76, 83], t, 0.075, "sine", 0.22, 0.09); osc("sine", N(95), N(95), t + 0.075, 0.28, 0.03); },

function blockEl(b) {

}
var END_WEEK = 35;   // semaine du 21 juin 2027 : fin de l’année académique
function openWeeks() {
  var real = realWeekIdx(), first = Math.min(0, minWeek(), cur), last = Math.max(real, cur, END_WEEK);
  Object.keys(state.weeks).forEach(function (k) { last = Math.max(last, +k); });
  openModal(head("Mes semaines") + '<div class="wgrid" id="wg"></div>');
  $("sheet").className = "sheet wide";
  bindClose();
  var grid = $("wg"), queue = [], selCard = null;
  for (var i = first; i <= last; i++) {
    (function (i) {
      var tr = tiersOf(i), t = totals(i), g = goalsOf(i);
      var a = weekStart(i), b = weekStart(i); b.setDate(b.getDate() + 6);
      var future = i > real && !(t.xp > 0 || tr.argent + tr.etude + tr.sport > 0);
      var card = mkEl("button", "wcard" + (i === cur ? " sel" : "") + (future ? " future" : ""));
      card.type = "button";
      var info = mkEl("div", "wt");
      var range = a.getDate() + (a.getMonth() !== b.getMonth() ? " " + MONTHS[a.getMonth()] : "") + " – " + b.getDate() + " " + MONTHS[b.getMonth()];
      var num = i + 1 < 0 ? "−" + (-(i + 1)) : (i + 1);
      if (future) {
        card.appendChild(mkEl("div", "wph", "À venir"));
        info.innerHTML = '<b>Semaine ' + num + '</b>' + range;
      } else {
        var cv = document.createElement("canvas"); cv.width = HR_W; cv.height = HR_H; card.appendChild(cv);
        queue.push(function () {
          if (!document.body.contains(cv)) return;
          var tg = { el: cv, ctx: cv.getContext("2d"), still: true };
          tg.img = tg.ctx.createImageData(PW, PH); tg.d32 = new Uint32Array(tg.img.data.buffer);
          renderFrame(tg.d32, 2, getAv(), tr, false); hiresPut(tg);
        });
        info.innerHTML = '<b>Semaine ' + num + '</b>' + range + " · " + weekStatus(i) +
          '<div class="wst">' + VEHICLES[tr.argent].n + '<br>' + ic("coins") + ' ' + pctOf(t.net, g.argent) + ' % · ' + ic("book") + ' ' + pctOf(t.study, g.etude) + ' % · ' + ic("activity") + ' ' + pctOf(t.sport, g.sport) + ' %</div>';
      }
      card.appendChild(info);
      card.style.setProperty("--i", Math.min(i - first, 14));
      card.onclick = function () { cur = i; if (i === real) selDay = todayDow(); enter = 1; dir = 0; closeModal(); renderAll(); };
      grid.appendChild(card);
      if (i === cur) selCard = card;
    })(i);
  }
  if (selCard) setTimeout(function () { try { selCard.scrollIntoView({ block: "center" }); } catch (e) {} }, 0);
  (function next() { var f = queue.shift(); if (f) { f(); setTimeout(next, 0); } })();
}
function swatches(k, list, cur0) {
  return '<div class="sw-row">' + list.map(function (c) {
    return '<button type="button" class="sw' + (c === cur0 ? " sel" : "") + '" data-k="' + k + '" data-v="' + c + '" style="background:' + c + '" aria-label="Couleur ' + c + '"></button>';
  }).join("") + "</div>";
}
function options(k, list, cur0) {
  return '<div class="sw-row">' + list.map(function (x) {
    return '<button type="button" class="opt' + (x.k === cur0 ? " sel" : "") + '" data-k="' + k + '" data-v="' + x.k + '">' + x.n + "</button>";
  }).join("") + "</div>";
}
function openCustom() {
  var w = getAv(), real = tiersOf(cur), mode = "real";
  openModal(head("Personnaliser mon avatar") +
    '<div class="seg"><button type="button" class="sel" data-m="real">Mon niveau</button><button type="button" data-m="max">Niveau maximum</button></div>' +
    '<div class="avprev"><canvas id="cp-canvas" width="576" height="384"></canvas></div>' +
    '<label>Peau</label>' + swatches("skin", PX_SKINS, w.skin) +
    '<label>Cheveux</label>' + options("hair", PX_HAIRS, w.hair) + '<div style="height:8px"></div>' + swatches("hairColor", PX_HAIR_COLORS, w.hairColor) +
    '<label>Casque (avant l’or)</label>' + swatches("helmet", PX_HELMETS, w.helmet) +
    '<label>Gilet</label>' + swatches("vest", PX_VESTS, w.vest) +
    '<label>Pantalon</label>' + swatches("pants", PX_PANTS, w.pants) +
    '<label>Chaussures</label>' + swatches("shoes", PX_SHOES, w.shoes) +
    '<div class="btns"><button class="btn" id="m-cancel">Annuler</button><button class="btn primary" id="cp-save">Enregistrer</button></div>');
  $("sheet").className = "sheet";
  bindClose();
  var tg = avMake($("cp-canvas"), function () { return { o: w, tr: mode === "max" ? { argent: 5, etude: 5, sport: 5 } : real }; }, false, "prev");
  avPaint(tg, avFrame, 0);
  $("sheet").onclick = function (e) {
    var el = e.target.closest ? e.target.closest("button") : null;
    if (!el) return;
    var m = el.getAttribute("data-m"), k = el.getAttribute("data-k");
    if (m) {
      mode = m;
      Array.prototype.forEach.call($("sheet").querySelectorAll(".seg button"), function (b) { b.classList.toggle("sel", b === el); });
      avPaint(tg, avFrame, 0);
    } else if (k) {
      w[k] = el.getAttribute("data-v");
      Array.prototype.forEach.call($("sheet").querySelectorAll('[data-k="' + k + '"]'), function (b) { b.classList.toggle("sel", b === el); });
      avPaint(tg, avFrame, 0);
    }
  };
  $("cp-save").onclick = function () { state.avatar = w; persist(); closeModal(); renderAll(); };
}
$("av-custom").onclick = openCustom;
$("av-weeks").onclick = openWeeks;
requestAnimationFrame(avTick);

function paintSnd() { var b = $("snd"); b.innerHTML = ic(SFX.isOn() ? "volume" : "volume-x"); b.classList.toggle("off", !SFX.isOn()); b.setAttribute("aria-pressed", SFX.isOn() ? "true" : "false"); }
$("snd").onclick = function () { SFX.unlock(); SFX.set(!SFX.isOn()); paintSnd(); if (SFX.isOn()) SFX.play("pick"); };
paintSnd();
["click", "touchend", "keydown"].forEach(function (ev) { document.addEventListener(ev, function once() { SFX.unlock(); document.removeEventListener(ev, once, true); }, true); });
var SFXMAP = [
  [".tb", function (el) { return el.id === "tb-stats" ? "tab_stats" : "tab_agenda"; }],
  ["#fab", "fab"], ["#prev", "prev"], ["#next", "next"], ["#wk-today", "today"], [".dpill", "day"], [".seg2 button", "view"], [".wcard", "page"],
  ["#m-x, #m-cancel", "close"], ["#f-save, #o-save, #cp-save", "save"], ["#f-del, .hdel", "del"], [".sw, .opt, .seg button, .tbtn, .chip", "pick"]
];
var errSnap = "";
document.addEventListener("click", function () { var er = document.querySelector(".err"); errSnap = er ? er.textContent : ""; }, true);
document.addEventListener("click", function (e) {
  var el = e.target.closest ? e.target.closest("button") : null; if (!el) return;
  var name = null;
  for (var i = 0; i < SFXMAP.length && !name; i++) if (el.matches(SFXMAP[i][0])) name = typeof SFXMAP[i][1] === "function" ? SFXMAP[i][1](el) : SFXMAP[i][1];
  window.setTimeout(function () {
    var er = document.querySelector(".err"), txt = er ? er.textContent.trim() : "";
    if (txt && txt !== errSnap.trim()) SFX.play("error"); else if (name) SFX.play(name);
  }, 0);
});
renderAll();
loadUclCalendar();
setSync("local");
setTimeout(function () { var n = $("now"); if (n && n.style.display !== "none") { try { n.scrollIntoView({ block: "center" }); } catch (e) {} } }, 300);
</script>
